[project]
name = "keinews"
version = "0.1.0"
description = "Fetch NHK news and summarize it with a local AI model (LM Studio) into simple Japanese"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "feedparser>=6.0.12",
    "requests>=2.34.2",
    "typer>=0.25.1",
]

[project.scripts]
keinews = "KeiNews.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
